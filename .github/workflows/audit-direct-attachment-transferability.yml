name: audit-direct-attachment-transferability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_direct_origin_attachment_transferability.py"
      - "scripts/audit_direct_primary_origin_distance_regimes.py"
      - "scripts/materialize_direct_primary_empirical_node_attachments.py"
      - "scripts/audit_service_osm_street_name_alignment.py"
      - ".github/workflows/audit-direct-attachment-transferability.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4" "scipy>=1.14,<2" "scikit-learn>=1.6,<2" "osmium>=4,<5" "PyYAML>=6,<7" "openpyxl>=3.1,<4" "xlrd>=2,<3"
      - name: Download validated access-evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: pa-origin-network-access-evidence
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32785322254
      - name: Build official Pará census sectors
        run: python src/data/ibge_census2022_sectors.py
      - name: Rebuild CNEFE sector origins
        run: python scripts/build_cnefe_sector_origins.py --chunksize 200000
      - name: Build service snapshots
        run: python scripts/build_service_inventory_from_snapshots.py
      - name: Build specialized services
        run: python scripts/build_specialized_service_sources.py --output-dir artifacts/service_inventory
      - name: Consolidate services
        run: python scripts/consolidate_service_inventory.py --artifact-dir artifacts/service_inventory --output artifacts/service_inventory/services_consolidated.csv
      - name: Apply accepted operational coordinates
        run: python scripts/apply_manual_service_coordinate_overrides.py --inventory artifacts/service_inventory/services_consolidated.csv --audit artifacts/service_inventory/manual_coordinate_overrides_audit.json
      - name: Audit service readiness
        run: python scripts/audit_service_readiness.py --inventory artifacts/service_inventory/services_consolidated.csv --output-dir artifacts/service_inventory
      - name: Materialize routing inputs
        run: python scripts/materialize_routing_inputs.py
      - name: Build official transport layers
        run: python scripts/build_transport_layers.py
      - name: Acquire OSM roads
        run: python scripts/acquire_osm_roads.py
      - name: Prepare multimodal graph inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Audit direct-origin attachment transferability
        run: python scripts/audit_direct_origin_attachment_transferability.py
      - name: Audit direct-primary empirical distance regimes
        run: python scripts/audit_direct_primary_origin_distance_regimes.py
      - name: Materialize gated empirical direct-primary node attachments
        run: python scripts/materialize_direct_primary_empirical_node_attachments.py
      - name: Audit service address to OSM street alignment
        run: python scripts/audit_service_osm_street_name_alignment.py
      - name: Validate safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('artifacts/direct_origin_attachment_transferability/direct_origin_attachment_transferability_audit.json').read_text())
          r=json.loads(Path('artifacts/direct_primary_origin_distance_regimes/direct_primary_origin_distance_regimes_audit.json').read_text())
          m=json.loads(Path('artifacts/direct_primary_empirical_node_attachments/direct_primary_empirical_node_attachments_audit.json').read_text())
          s=json.loads(Path('artifacts/service_osm_street_name_alignment/service_osm_street_name_alignment_audit.json').read_text())
          assert o['direct_primary_origin_count'] == 14306
          assert o['validated_positive_control_count'] == 4368
          assert o['direct_primary_without_local_nominal_validation_count'] == 9938
          assert o['positive_control_range_is_routing_cutoff'] is False
          assert o['ecdf_used_for_connector_promotion'] is False
          assert o['connector_promoted'] is False
          assert o['travel_time_assigned'] is False
          assert r['direct_primary_origin_count'] == 14306
          assert r['positive_control_count'] == 4368
          assert r['unvalidated_direct_count'] == 9938
          assert r['positive_control_lower_regime_fraction'] == 1.0
          assert r['bootstrap_valid_intersections'] >= 190
          assert r['bootstrap_bic_gain']['p05'] > 0
          assert r['posterior_boundary_hardcoded'] is False
          assert r['distance_regime_is_routing_cutoff'] is False
          assert r['connector_promoted'] is False
          assert r['travel_time_assigned'] is False
          assert m['additional_empirical_direct_primary_attachments'] == r['unvalidated_direct_in_lower_regime']
          assert m['empirical_boundary_hardcoded'] is False
          assert m['distance_regime_is_physical_access_cutoff'] is False
          assert m['creates_temporal_edge'] is False
          assert m['travel_time_assigned'] is False
          assert m['zero_time_edge_created'] is False
          assert m['distance_used_as_travel_length'] is False
          assert s['service_count'] == 236
          assert s['direct_primary_service_count'] == 227
          assert s['distance_cutoff_used'] is False
          assert s['connector_promoted'] is False
          assert s['travel_time_assigned'] is False
          print(json.dumps({'origin_transferability':o,'origin_distance_regimes':r,'empirical_node_attachments':m,'service_nominal_alignment':s}, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-direct-attachment-transferability
          path: |
            artifacts/direct_origin_attachment_transferability/
            artifacts/direct_primary_origin_distance_regimes/
            artifacts/direct_primary_empirical_node_attachments/
            artifacts/service_osm_street_name_alignment/
          if-no-files-found: error
          retention-days: 30
