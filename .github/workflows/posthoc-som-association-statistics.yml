name: Post-hoc SOM association statistics

on:
  workflow_dispatch:
  push:
    branches: [stage4-mcdm]
    paths:
      - '.github/workflows/posthoc-som-association-statistics.yml'
      - 'src/analysis/publish_posthoc_som_association_statistics.py'
      - 'results/integrated_synthesis/tables/integrated_municipal_e2sfca_mcdm_som.csv'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage4-mcdm
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib scipy statsmodels
      - name: Run post-hoc statistics
        run: python -m src.analysis.publish_posthoc_som_association_statistics
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json, pandas as pd
          a=json.load(open('results/posthoc_statistics/tables/posthoc_statistics_audit.json',encoding='utf-8'))
          g=pd.read_csv('results/posthoc_statistics/tables/posthoc_global_tests.csv')
          c=pd.read_csv('results/posthoc_statistics/tables/posthoc_chi_square_top_quartile.csv')
          assert a['municipalities']==144
          assert a['som_training_variables_tested_as_independent_validation'] is False
          assert a['som_retrained'] is False
          assert a['promethee_reranked'] is False
          assert a['e2sfca_recomputed'] is False
          assert len(g)==7
          assert g['epsilon_squared'].between(0,1,inclusive='both').all()
          assert len(c)==1
          print(g[['outcome','kruskal_p','kruskal_p_holm_across_outcomes','epsilon_squared']].to_string(index=False))
          print(c.to_string(index=False))
          PY
          test -s results/posthoc_statistics/figures/posthoc_global_tests_effects.png
          test -s results/posthoc_statistics/figures/posthoc_global_tests_effects.pdf
          test -s results/posthoc_statistics/posthoc_statistical_results.md
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/posthoc_statistics
          if git diff --cached --quiet; then
            echo 'No post-hoc statistics changes to commit.'
          else
            git commit -m 'Publish post-hoc SOM association statistics'
            git pull --rebase origin stage4-mcdm
            git push origin HEAD:stage4-mcdm
          fi
