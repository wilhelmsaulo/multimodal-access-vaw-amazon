name: materialize-route-authorized-directed-hydro-graph

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/materialize_route_authorized_directed_hydro_graph.py"
      - "scripts/audit_hydro_endpoint_municipality_orientation.py"
      - "scripts/build_hydro_topology_with_validated_snaps.py"
      - ".github/workflows/materialize-route-authorized-directed-hydro-graph.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4" "osmium>=4,<5"
      - name: Acquire official transport layers
        run: python scripts/build_transport_layers.py
      - name: Acquire OSM roads
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build hydro temporal reference
        run: python scripts/build_hydro_temporal_graph_reference.py
      - name: Subdivide hydro reference time
        run: python scripts/subdivide_hydro_reference_time.py
      - name: Build transport topology
        run: python scripts/build_transport_topology.py
      - name: Build official crossing positive controls
        run: python scripts/audit_antaq_crossing_endpoint_positive_controls.py
      - name: Audit physical transfer ports
        run: python scripts/audit_antaq_physical_transfer_ports.py
      - name: Classify physical transfer candidates
        run: python scripts/classify_physical_transfer_port_candidates.py
      - name: Audit Pareto front-1 provenance
        run: python scripts/audit_pareto_front1_transfer_ports.py
      - name: Audit front-1 against canonical hydro
        run: python scripts/audit_front1_against_canonical_hydro.py
      - name: Materialize validated anchors
        run: python scripts/materialize_validated_spatial_transfer_anchors.py
      - name: Compare anchors with positive controls
        run: python scripts/compare_front1_anchors_to_crossing_positive_controls.py
      - name: Finalize spatial snap rule
        run: python scripts/finalize_spatial_transfer_snap_rule.py
      - name: Audit spatial snap sensitivity
        run: python scripts/audit_spatial_snap_sensitivity.py
      - name: Finalize non-temporal snap semantics
        run: python scripts/finalize_non_temporal_cartographic_snap_rule.py
      - name: Build hydro topology with validated snaps
        run: python scripts/build_hydro_topology_with_validated_snaps.py
      - name: Audit reciprocal orientation evidence
        run: python scripts/audit_hydro_geometry_orientation_from_reciprocals.py
      - name: Audit endpoint municipality orientation
        run: python scripts/audit_hydro_endpoint_municipality_orientation.py
      - name: Materialize route-authorized directed hydro graph
        run: python scripts/materialize_route_authorized_directed_hydro_graph.py
      - name: Validate restricted directed graph safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/route_authorized_directed_hydro_graph/route_authorized_directed_hydro_graph_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['official_routes_total'] == 358
          assert d['direction_authorized_routes'] == 138
          assert d['forward_consistent_routes'] == 21
          assert d['reverse_consistent_routes'] == 117
          assert d['unresolved_routes_excluded'] == 220
          assert d['route_time_conservation_fraction'] == 1.0
          assert d['statewide_direction_assumption_used'] is False
          assert d['synthetic_reverse_edges_created'] is False
          assert d['same_municipality_routes_promoted'] is False
          assert d['unresolved_routes_promoted'] is False
          assert d['waiting_time_included'] is False
          assert d['ready_for_restricted_directed_hydro_routing'] is True
          assert d['ready_for_statewide_directed_hydro_routing'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-route-authorized-directed-hydro-graph
          path: artifacts/route_authorized_directed_hydro_graph/
          if-no-files-found: error
          retention-days: 30
