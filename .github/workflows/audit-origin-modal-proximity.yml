name: audit-origin-modal-proximity

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_origin_modal_proximity.py"
      - "scripts/materialize_routing_inputs.py"
      - "scripts/acquire_osm_roads.py"
      - "scripts/prepare_multimodal_graph_inputs.py"
      - "scripts/build_transport_layers.py"
      - "src/network/**"
      - "src/data/**"
      - "data/candidates/manual_service_coordinate_overrides_*.csv"
      - "data/snapshots/**"
      - ".github/workflows/audit-origin-modal-proximity.yml"
  push:
    branches: [agent/stage1-stage2-accessibility]
    paths:
      - "scripts/audit_origin_modal_proximity.py"
      - "scripts/materialize_routing_inputs.py"
      - "scripts/acquire_osm_roads.py"
      - "scripts/prepare_multimodal_graph_inputs.py"
      - "scripts/build_transport_layers.py"
      - "src/network/**"
      - "src/data/**"
      - "data/candidates/manual_service_coordinate_overrides_*.csv"
      - "data/snapshots/**"
      - ".github/workflows/audit-origin-modal-proximity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origin-modal-proximity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            "geopandas>=1.0,<2" \
            "pyogrio>=0.10,<1" \
            "shapely>=2,<3" \
            "PyYAML>=6,<7" \
            "openpyxl>=3.1,<4" \
            "xlrd>=2,<3"
      - name: Build official Pará census sectors
        run: python src/data/ibge_census2022_sectors.py
      - name: Build validated CNEFE sector origins
        run: python scripts/build_cnefe_sector_origins.py --chunksize 200000
      - name: Build service inventory
        run: |
          python scripts/build_service_inventory_from_snapshots.py
          python scripts/build_specialized_service_sources.py --output-dir artifacts/service_inventory
          python scripts/consolidate_service_inventory.py --artifact-dir artifacts/service_inventory --output artifacts/service_inventory/services_consolidated.csv
          python scripts/apply_manual_service_coordinate_overrides.py --inventory artifacts/service_inventory/services_consolidated.csv --audit artifacts/service_inventory/manual_coordinate_overrides_audit.json
          python scripts/audit_service_readiness.py --inventory artifacts/service_inventory/services_consolidated.csv --output-dir artifacts/service_inventory
      - name: Materialize routing inputs
        run: python scripts/materialize_routing_inputs.py
      - name: Build official transport reference layers
        run: python scripts/build_transport_layers.py
      - name: Acquire routable OSM roads
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal layers
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Audit origin modal proximity
        run: python scripts/audit_origin_modal_proximity.py
      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/origin_modal_proximity/origin_modal_proximity_summary.json")
          a = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps(a, ensure_ascii=False, indent=2))
          assert a["origins"] == 15743
          assert a["layers"]["roads"] > 0
          assert a["layers"]["waterways"] > 0
          assert a["layers"]["ports"] > 0
          assert a["ready_for_connector_model_decision"] is True
          assert a["travel_time_assigned"] is False
          PY
      - name: Upload modal proximity audit
        uses: actions/upload-artifact@v4
        with:
          name: pa-origin-modal-proximity
          path: artifacts/origin_modal_proximity/
          if-no-files-found: error
          retention-days: 30
