name: publish-stage1-sector-origin-maps

on:
  workflow_dispatch:
  push:
    branches: [stage4-mcdm]
    paths:
      - 'src/analysis/publish_stage1_sector_origin_maps.py'
      - '.github/workflows/publish-stage1-sector-origin-maps.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-mcdm
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install publication dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'geopandas>=1.0,<2' 'pyogrio>=0.10,<1' 'shapely>=2,<3' 'matplotlib>=3.9,<4' 'pyproj>=3.7,<4'
      - name: Download Census 2022 sectors
        uses: actions/download-artifact@v4
        with:
          name: pa-census-sectors-2022
          path: artifacts/census2022
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32170796657
      - name: Download frozen routing endpoints
        uses: actions/download-artifact@v4
        with:
          name: pa-frozen-routing-endpoints
          path: artifacts/endpoints
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32945266691
      - name: Build item 3 sector-origin maps
        run: |
          python src/analysis/publish_stage1_sector_origin_maps.py \
            --census-gpkg artifacts/census2022/pa_census_sectors_2022.gpkg \
            --endpoints artifacts/endpoints/origin_routing_endpoints.csv.gz \
            --reachability results/stage2_od/tables/origin_reachability_summary.csv.gz \
            --out results/stage1_sector_origins
      - name: Validate publication bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=Path('results/stage1_sector_origins')
          m=json.loads((p/'publication_metadata.json').read_text())
          assert m['sectors']==16714 and m['routing_ready_origins']==12673
          a=pd.read_csv(p/'tables/sector_access_status_summary.csv')
          assert int(a.sectors.sum())==16714 and len(a)==3
          for f in ['census_sector_distribution.png','female_population_by_sector.png','sector_reference_network_access.png']:
              q=p/'figures'/f
              assert q.exists() and q.stat().st_size>0, q
          PY
      - name: Commit item 3 publication bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/stage1_sector_origins
          if git diff --cached --quiet; then
            echo 'No sector-origin changes to commit.'
          else
            git commit -m 'Publish census-sector origin maps'
            git fetch origin stage4-mcdm
            git rebase origin/stage4-mcdm
            git push origin HEAD:stage4-mcdm
          fi
