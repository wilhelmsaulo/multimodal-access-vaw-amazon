name: build-service-inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/build_service_inventory_sources.py"
      - "scripts/build_specialized_service_sources.py"
      - "src/data/service_inventory.py"
      - ".github/workflows/build-service-inventory.yml"
      - "pyproject.toml"
  push:
    branches:
      - agent/stage1-stage2-accessibility
    paths:
      - "scripts/build_service_inventory_sources.py"
      - "scripts/build_specialized_service_sources.py"
      - "src/data/service_inventory.py"
      - ".github/workflows/build-service-inventory.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "openpyxl>=3.1,<4" "xlrd>=2,<3"
      - name: Build CNES and CREAS extracts
        run: python scripts/build_service_inventory_sources.py --output-dir artifacts/service_inventory
      - name: Build TJPA and Ligue 180 source audit
        run: python scripts/build_specialized_service_sources.py --output-dir artifacts/service_inventory
      - name: Show build summaries
        run: |
          cat artifacts/service_inventory/build_summary.json
          cat artifacts/service_inventory/specialized_sources_summary.json
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-inventory-pa
          path: artifacts/service_inventory/
          if-no-files-found: error
          retention-days: 30
