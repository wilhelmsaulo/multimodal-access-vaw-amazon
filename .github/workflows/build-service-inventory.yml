name: build-service-inventory

on:
  push:
    branches:
      - agent/stage1-stage2-accessibility
    paths:
      - "scripts/build_service_inventory_sources.py"
      - "src/data/service_inventory.py"
      - ".github/workflows/build-service-inventory.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "openpyxl>=3.1,<4" "xlrd>=2,<3"
      - name: Build official Pará service-source extracts
        run: python scripts/build_service_inventory_sources.py --output-dir artifacts/service_inventory
      - name: Show build summary
        run: cat artifacts/service_inventory/build_summary.json
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-inventory-pa
          path: artifacts/service_inventory/
          if-no-files-found: error
          retention-days: 30
