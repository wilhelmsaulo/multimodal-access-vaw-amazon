name: audit-cnefe-osm-street-name-alignment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_cnefe_osm_street_name_alignment.py"
      - "scripts/audit_representative_origin_cnefe_metadata.py"
      - "scripts/build_cnefe_sector_origins.py"
      - "scripts/acquire_osm_roads.py"
      - "scripts/prepare_multimodal_graph_inputs.py"
      - "src/data/ibge_census2022_sectors.py"
      - "config/cnefe_origin_rules.yml"
      - ".github/workflows/audit-cnefe-osm-street-name-alignment.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4" "PyYAML>=6,<7"
      - name: Build official Pará census sectors
        run: python src/data/ibge_census2022_sectors.py
      - name: Build CNEFE representative origins
        run: python scripts/build_cnefe_sector_origins.py --chunksize 200000
      - name: Recover full CNEFE street metadata
        run: python scripts/audit_representative_origin_cnefe_metadata.py --chunksize 200000
      - name: Rebuild official reference transport layers
        run: python scripts/build_transport_layers.py
      - name: Acquire OSM road network
        run: python scripts/acquire_osm_roads.py
      - name: Prepare multimodal graph inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Audit CNEFE OSM street-name alignment
        run: python scripts/audit_cnefe_osm_street_name_alignment.py
      - name: Validate safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/cnefe_osm_street_name_alignment/cnefe_osm_street_name_alignment_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['origins_with_cnefe_street_metadata'] > 0
          assert d['named_osm_road_features'] > 0
          assert d['coordinate_changed'] is False
          assert d['distance_cutoff_used'] is False
          assert d['network_connector_promoted'] is False
          assert d['travel_time_assigned'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-cnefe-osm-street-name-alignment
          path: artifacts/cnefe_osm_street_name_alignment/
          if-no-files-found: error
          retention-days: 30
