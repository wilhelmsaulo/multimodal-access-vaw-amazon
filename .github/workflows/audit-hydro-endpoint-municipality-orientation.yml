name: audit-hydro-endpoint-municipality-orientation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_hydro_endpoint_municipality_orientation.py"
      - "scripts/audit_hydro_geometry_orientation_from_reciprocals.py"
      - "scripts/build_hydro_temporal_graph_reference.py"
      - "src/network/source_catalog.py"
      - ".github/workflows/audit-hydro-endpoint-municipality-orientation.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire transport bundle
        run: python scripts/build_transport_layers.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build hydro temporal reference graph
        run: python scripts/build_hydro_temporal_graph_reference.py
      - name: Run reciprocal orientation audit
        run: python scripts/audit_hydro_geometry_orientation_from_reciprocals.py
      - name: Validate endpoints against IBGE municipalities
        run: python scripts/audit_hydro_endpoint_municipality_orientation.py
      - name: Validate safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/hydro_endpoint_municipality_orientation/hydro_endpoint_municipality_orientation_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['official_routes_total'] == 358
          assert d['ibge_actual_sha256'] == d['ibge_expected_sha256']
          assert d['statewide_geometry_order_validated'] is False
          assert d['statewide_geometry_order_assumption_used'] is False
          assert d['distance_threshold_used'] is False
          assert d['buffer_used'] is False
          assert d['same_municipality_routes_directionally_informative'] is False
          assert d['automatic_reverse_edge_creation_used'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-hydro-endpoint-municipality-orientation
          path: artifacts/hydro_endpoint_municipality_orientation/
          if-no-files-found: error
          retention-days: 30
