name: audit-antaq-physical-transfer-ports

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_antaq_physical_transfer_ports.py"
      - ".github/workflows/audit-antaq-physical-transfer-ports.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire official transport layers
        run: python scripts/build_transport_layers.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Audit physical transfer ports
        run: python scripts/audit_antaq_physical_transfer_ports.py
      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/antaq_physical_transfer_ports/pa_physical_transfer_port_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['pa_port_rows'] > 0
          assert d['ports_with_endpoint_compatible_hydro'] > 0
          assert d['connector_promoted'] is False
          assert d['ready_for_physical_transfer_rule_decision'] is True
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-antaq-physical-transfer-port-audit
          path: artifacts/antaq_physical_transfer_ports/
          if-no-files-found: error
          retention-days: 30
