name: audit-antaq-crossing-endpoint-positive-controls

on:
  pull_request:
    paths:
      - "scripts/audit_antaq_crossing_endpoint_positive_controls.py"
      - ".github/workflows/audit-antaq-crossing-endpoint-positive-controls.yml"
      - "scripts/build_transport_layers.py"
      - "scripts/acquire_osm_roads.py"
      - "scripts/prepare_multimodal_graph_inputs.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire official transport layers
        run: python scripts/build_transport_layers.py
      - name: Acquire OSM road network
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Audit ANTAQ crossing endpoints as positive controls
        run: python scripts/audit_antaq_crossing_endpoint_positive_controls.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/antaq_crossing_endpoint_positive_controls/pa_crossing_endpoints_positive_controls_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['pa_crossing_lines'] == 13
          assert d['pa_official_endpoints_with_coordinates'] > 0
          assert d['connector_rule_adopted'] is False
          assert d['distance_threshold_adopted'] is False
          assert d['distance_to_time_conversion_used'] is False
          assert d['routing_enabled'] is False
          assert d['ready_for_empirical_connector_geometry_decision'] is True
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-antaq-crossing-endpoint-positive-controls
          path: artifacts/antaq_crossing_endpoint_positive_controls/
          if-no-files-found: error
          retention-days: 30
