name: assemble-final-multimodal-graph-manifest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/assemble_final_multimodal_graph_manifest.py"
      - ".github/workflows/assemble-final-multimodal-graph-manifest.yml"

jobs:
  assemble-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download validated road temporal graph
        uses: actions/download-artifact@v4
        with:
          name: pa-primary-motor-road-times
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32868022294

      - name: Download validated hydro temporal reference
        uses: actions/download-artifact@v4
        with:
          name: pa-hydro-temporal-reference-graph
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32868022217

      - name: Download validated hydro topology
        uses: actions/download-artifact@v4
        with:
          name: pa-hydro-topology-with-validated-snaps
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32868022260

      - name: Download validated transfer anchors
        uses: actions/download-artifact@v4
        with:
          name: pa-validated-spatial-transfer-anchors
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32868022264

      - name: Download validated origin attachments
        uses: actions/download-artifact@v4
        with:
          name: pa-direct-attachment-transferability
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32861477674

      - name: Download final service access policy
        uses: actions/download-artifact@v4
        with:
          name: pa-service-direct-primary-distance-regimes
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32887184265

      - name: Assemble final graph manifest
        run: python scripts/assemble_final_multimodal_graph_manifest.py

      - name: Validate final graph manifest safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/final_multimodal_graph_manifest/final_multimodal_graph_manifest.json').read_text())
          assert m['road_temporal_edge_count'] > 3_000_000
          assert m['road_edges_missing_time'] == 0
          assert m['road_time_coverage_fraction'] == 1.0
          assert m['accepted_origin_structural_attachment_count'] > 10_000
          assert m['service_primary_usable_count'] == 225
          assert m['service_primary_residual_count'] == 11
          assert m['air_temporal_routing_included'] is False
          assert m['waiting_time_included'] is False
          assert m['zero_time_connector_edges_created'] is False
          assert m['euclidean_distance_converted_to_travel_time'] is False
          assert m['track_in_primary_graph'] is False
          assert m['restricted_edges_promoted'] is False
          assert m['ready_for_physical_multimodal_edge_union'] is True
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pa-final-multimodal-graph-manifest
          path: artifacts/final_multimodal_graph_manifest/
          if-no-files-found: error
          retention-days: 30
