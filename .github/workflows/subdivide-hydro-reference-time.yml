name: subdivide-hydro-reference-time

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/subdivide_hydro_reference_time.py"
      - "scripts/build_hydro_temporal_graph_reference.py"
      - "scripts/prepare_multimodal_graph_inputs.py"
      - ".github/workflows/subdivide-hydro-reference-time.yml"

jobs:
  subdivide:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire transport bundle
        run: python scripts/build_transport_layers.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build hydro temporal reference graph
        run: python scripts/build_hydro_temporal_graph_reference.py
      - name: Subdivide hydro reference time
        run: python scripts/subdivide_hydro_reference_time.py
      - name: Validate conservation audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/hydro_temporal_subdivision/hydro_temporal_subdivision_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['official_routes_total'] == 122
          assert d['official_routes_audited'] == 122
          assert d['subedges_total'] == 8027
          assert d['time_conservation_fraction'] == 1.0
          assert d['route_specific_identity_preserved'] is True
          assert d['parallel_routes_collapsed'] is False
          assert d['waiting_time_included'] is False
          assert d['distance_to_external_speed_conversion_used'] is False
          assert d['passenger_realized_time_claimed'] is False
          assert d['ready_for_hydro_topology_integration'] is True
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-hydro-reference-time-subdivision
          path: artifacts/hydro_temporal_subdivision/
          if-no-files-found: error
          retention-days: 30
