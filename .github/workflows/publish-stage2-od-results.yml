name: publish-stage2-od-results

on:
  workflow_dispatch:
  push:
    branches:
      - stage4-mcdm
    paths:
      - 'src/analysis/publish_stage2_od_results.py'
      - '.github/workflows/publish-stage2-od-results.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-mcdm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'matplotlib>=3.9,<4'

      - name: Download authoritative corrected OD artifact
        uses: actions/download-artifact@v4
        with:
          name: pa-corrected-reference-od
          path: artifacts/od
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33089335405

      - name: Build Stage 2 OD publication bundle
        run: |
          python src/analysis/publish_stage2_od_results.py \
            --od-dir artifacts/od \
            --out results/stage2_od

      - name: Validate publication bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,pandas as pd
          p=Path('results/stage2_od')
          meta=json.loads((p/'publication_metadata.json').read_text())
          assert meta['corrected_od_run']==33089335405
          assert meta['od_pairs']==2851425 and meta['origins']==12673 and meta['services']==225
          mat=pd.read_csv(p/'tables/representative_od_time_matrix_40x40.csv',index_col=0)
          assert mat.shape==(40,40)
          for f in [p/'figures/representative_od_time_matrix.png',p/'figures/origin_reachable_fraction_distribution.png',p/'figures/reachable_travel_time_distribution.png',p/'README.md']:
              assert f.exists() and f.stat().st_size>0, f
          PY

      - name: Commit generated Stage 2 OD publication bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/stage2_od
          if git diff --cached --quiet; then
            echo 'No Stage 2 OD publication changes to commit.'
          else
            git commit -m 'Publish corrected Stage 2 OD documentation'
            git pull --rebase origin stage4-mcdm
            git push origin HEAD:stage4-mcdm
          fi
