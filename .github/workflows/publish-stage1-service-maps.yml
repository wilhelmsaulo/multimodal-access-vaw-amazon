name: publish-stage1-service-maps

on:
  workflow_dispatch:
  push:
    branches: [stage4-mcdm]
    paths:
      - 'src/analysis/publish_stage1_service_maps.py'
      - '.github/workflows/publish-stage1-service-maps.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-mcdm
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install publication dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3' 'geopandas>=1.0,<2' 'pyogrio>=0.10,<1' 'shapely>=2,<3' 'matplotlib>=3.9,<4' 'pyproj>=3.7,<4'
      - name: Download validated service inventory
        uses: actions/download-artifact@v4
        with:
          name: service-inventory-pa
          path: artifacts/service_inventory
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33021740349
      - name: Build item 1 service maps
        run: |
          python src/analysis/publish_stage1_service_maps.py \
            --inventory artifacts/service_inventory/services_consolidated.csv \
            --out results/stage1_services
      - name: Validate publication bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=Path('results/stage1_services')
          m=json.loads((p/'publication_metadata.json').read_text())
          s=pd.read_csv(p/'tables/service_site_summary.csv')
          assert m['physical_sites']==236 and m['functional_records']==239
          assert dict(zip(s.service_type,s.physical_sites)) == {'creas':138,'health':71,'specialized_justice':6,'specialized_security':21}
          for stem in ['all_service_sites','service_sites__health','service_sites__creas','service_sites__specialized_security','service_sites__specialized_justice']:
              for ext in ['png','svg']:
                  f=p/'figures'/f'{stem}.{ext}'
                  assert f.exists() and f.stat().st_size>0, f
          assert len(pd.read_csv(p/'tables/validated_physical_service_sites.csv'))==236
          PY
      - name: Commit item 1 publication bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/stage1_services
          if git diff --cached --quiet; then
            echo 'No service-map changes to commit.'
          else
            git commit -m 'Publish validated service equipment maps'
            git fetch origin stage4-mcdm
            git rebase origin/stage4-mcdm
            git push origin HEAD:stage4-mcdm
          fi
