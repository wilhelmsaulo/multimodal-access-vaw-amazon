name: audit-origin-network-access-evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_local_access_to_primary_motor_network.py"
      - "scripts/audit_service_local_access_to_primary_motor_network.py"
      - "scripts/audit_local_access_path_modal_composition.py"
      - "scripts/classify_origin_network_access_evidence.py"
      - "scripts/classify_aligned_local_path_modal_composition.py"
      - "scripts/materialize_pedestrian_local_access_times.py"
      - "scripts/audit_mixed_aligned_local_paths.py"
      - "scripts/audit_service_local_path_modal_composition.py"
      - "scripts/materialize_service_pedestrian_local_access_times.py"
      - "scripts/audit_nonprimary_motorlike_path_exclusion_reasons.py"
      - "scripts/audit_representative_origin_cnefe_metadata.py"
      - "scripts/audit_cnefe_osm_street_name_alignment.py"
      - "scripts/audit_cnefe_osm_alignment_regimes.py"
      - "scripts/materialize_empirical_origin_cartographic_alignment.py"
      - "scripts/audit_origin_cartographic_topology_intersection.py"
      - "scripts/audit_aligned_topology_gap_residuals.py"
      - ".github/workflows/audit-origin-network-access-evidence.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4" "scipy>=1.14,<2" "scikit-learn>=1.6,<2" "osmium>=4,<5" "PyYAML>=6,<7" "openpyxl>=3.1,<4" "xlrd>=2,<3"
      - name: Build official Pará census sectors
        run: python src/data/ibge_census2022_sectors.py
      - name: Build CNEFE sector origins
        run: python scripts/build_cnefe_sector_origins.py --chunksize 200000
      - name: Recover full CNEFE street metadata
        run: python scripts/audit_representative_origin_cnefe_metadata.py --chunksize 200000
      - name: Build service snapshots
        run: python scripts/build_service_inventory_from_snapshots.py
      - name: Build specialized services
        run: python scripts/build_specialized_service_sources.py --output-dir artifacts/service_inventory
      - name: Consolidate services
        run: python scripts/consolidate_service_inventory.py --artifact-dir artifacts/service_inventory --output artifacts/service_inventory/services_consolidated.csv
      - name: Apply accepted operational coordinates
        run: python scripts/apply_manual_service_coordinate_overrides.py --inventory artifacts/service_inventory/services_consolidated.csv --audit artifacts/service_inventory/manual_coordinate_overrides_audit.json
      - name: Audit service readiness
        run: python scripts/audit_service_readiness.py --inventory artifacts/service_inventory/services_consolidated.csv --output-dir artifacts/service_inventory
      - name: Materialize routing inputs
        run: python scripts/materialize_routing_inputs.py
      - name: Build official transport layers
        run: python scripts/build_transport_layers.py
      - name: Acquire OSM road network
        run: python scripts/acquire_osm_roads.py
      - name: Prepare multimodal graph inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build OSM transport topology
        run: python scripts/build_transport_topology.py
      - name: Build primary motor graph
        run: python scripts/build_primary_motor_road_graph.py
      - name: Assign road travel times
        run: python scripts/assign_primary_road_travel_times.py
      - name: Complete road link times
        run: python scripts/complete_primary_road_link_times.py
      - name: Audit access connector semantics
        run: python scripts/audit_access_connector_semantics.py
      - name: Audit local origin access to primary motor graph
        run: python scripts/audit_local_access_to_primary_motor_network.py
      - name: Audit local service access to primary motor graph
        run: python scripts/audit_service_local_access_to_primary_motor_network.py
      - name: Reconstruct local path modal composition
        run: python scripts/audit_local_access_path_modal_composition.py
      - name: Classify origin network access evidence
        run: python scripts/classify_origin_network_access_evidence.py
      - name: Audit CNEFE OSM street-name alignment
        run: python scripts/audit_cnefe_osm_street_name_alignment.py
      - name: Audit empirical alignment regimes
        run: python scripts/audit_cnefe_osm_alignment_regimes.py --bootstrap 200
      - name: Materialize empirical local cartographic-alignment policy
        run: python scripts/materialize_empirical_origin_cartographic_alignment.py
      - name: Intersect cartographic and topological origin evidence
        run: python scripts/audit_origin_cartographic_topology_intersection.py
      - name: Classify aligned local path modal composition
        run: python scripts/classify_aligned_local_path_modal_composition.py
      - name: Materialize pedestrian local access times
        run: python scripts/materialize_pedestrian_local_access_times.py
      - name: Audit mixed aligned local paths
        run: python scripts/audit_mixed_aligned_local_paths.py
      - name: Audit service local path modal composition
        run: python scripts/audit_service_local_path_modal_composition.py
      - name: Materialize pedestrian service local access times
        run: python scripts/materialize_service_pedestrian_local_access_times.py
      - name: Audit motor-like local path exclusion reasons
        run: python scripts/audit_nonprimary_motorlike_path_exclusion_reasons.py
      - name: Audit aligned topology-gap residuals
        run: python scripts/audit_aligned_topology_gap_residuals.py
      - name: Validate safeguards and expected partition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/origin_network_access_evidence/origin_network_access_evidence_audit.json').read_text())
          a=json.loads(Path('artifacts/origin_cartographic_topology_intersection/origin_cartographic_topology_intersection_audit.json').read_text())
          c=json.loads(Path('artifacts/aligned_local_path_modal_composition/aligned_local_path_modal_composition_audit.json').read_text())
          p=json.loads(Path('artifacts/pedestrian_local_access_times/pedestrian_local_access_times_audit.json').read_text())
          m=json.loads(Path('artifacts/mixed_aligned_local_paths/mixed_aligned_local_paths_audit.json').read_text())
          s=json.loads(Path('artifacts/service_local_access_primary_motor_audit/service_local_access_primary_motor_audit.json').read_text())
          sp=json.loads(Path('artifacts/service_local_path_modal_composition/service_local_path_modal_composition_audit.json').read_text())
          spt=json.loads(Path('artifacts/service_pedestrian_local_access_times/service_pedestrian_local_access_times_audit.json').read_text())
          nr=json.loads(Path('artifacts/nonprimary_motorlike_exclusion_reasons/nonprimary_motorlike_exclusion_reasons_audit.json').read_text())
          g=json.loads(Path('artifacts/aligned_topology_gap_residuals/aligned_topology_gap_residuals_audit.json').read_text())
          assert d['origin_count'] == 15743
          assert a['aligned_primary_motor_topology_count'] == 4368
          assert c['aligned_local_path_origins'] == 157
          assert c['evidence_class_counts']['exclusively_pedestrian_osm_path'] == 45
          assert c['evidence_class_counts']['mixed_or_other_local_osm_path'] == 109
          assert c['evidence_class_counts']['track_involved_sensitivity_only'] == 3
          assert p['pedestrian_local_access_origins'] == 45
          assert p['walking_speed_kmh'] == 3.6
          assert p['cartographic_alignment_distance_converted_to_time'] is False
          assert p['mixed_or_other_paths_temporalized'] is False
          assert m['mixed_aligned_local_path_origins'] == 109
          assert m['travel_time_assigned'] is False
          assert s['service_site_count'] == 236
          assert s['nearest_osm_node_already_in_primary_motor_graph'] == 227
          assert s['local_nonmotor_sites_topologically_connected_to_primary_motor'] == 8
          assert s['local_nonmotor_sites_not_connected_to_primary_motor'] == 1
          assert sp['service_local_path_sites'] == 8
          assert sp['travel_time_assigned'] is False
          assert spt['service_pedestrian_local_access_sites'] == 5
          assert spt['walking_speed_kmh'] == 3.6
          assert spt['straight_line_distance_converted_to_time'] is False
          assert spt['restricted_motorlike_paths_temporalized'] is False
          assert nr['origin_motorlike_targets'] == 103
          assert nr['origin_targets_with_explicit_restriction'] == 103
          assert nr['service_motorlike_targets'] == 2
          assert nr['service_targets_with_explicit_restriction'] == 2
          assert nr['new_speed_assumption_used'] is False
          assert nr['restricted_edges_promoted'] is False
          assert nr['travel_time_assigned'] is False
          assert g['residual_count'] == 6
          assert g['nearest_same_name_motor_class_count'] == 6
          print(json.dumps({'origins':d,'intersection':a,'aligned_paths':c,'pedestrian_times':p,'mixed_paths':m,'services':s,'service_paths':sp,'service_pedestrian_times':spt,'nonprimary_motorlike':nr,'topology_gaps':g}, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-origin-network-access-evidence
          path: |
            artifacts/local_access_primary_motor_audit/
            artifacts/service_local_access_primary_motor_audit/
            artifacts/local_access_path_modal_composition/
            artifacts/origin_network_access_evidence/
            artifacts/cnefe_osm_alignment_regimes/
            artifacts/empirical_origin_cartographic_alignment/
            artifacts/origin_cartographic_topology_intersection/
            artifacts/aligned_local_path_modal_composition/
            artifacts/pedestrian_local_access_times/
            artifacts/mixed_aligned_local_paths/
            artifacts/service_local_path_modal_composition/
            artifacts/service_pedestrian_local_access_times/
            artifacts/nonprimary_motorlike_exclusion_reasons/
            artifacts/aligned_topology_gap_residuals/
          if-no-files-found: error
          retention-days: 30
