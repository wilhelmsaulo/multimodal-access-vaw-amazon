name: materialize-validated-spatial-transfer-anchors

on:
  pull_request:
    paths:
      - 'scripts/materialize_validated_spatial_transfer_anchors.py'
      - 'scripts/audit_front1_against_canonical_hydro.py'
      - 'scripts/classify_physical_transfer_port_candidates.py'
      - 'scripts/audit_antaq_physical_transfer_ports.py'
      - '.github/workflows/materialize-validated-spatial-transfer-anchors.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire official transport layers
        run: python scripts/build_transport_layers.py
      - name: Acquire OSM road network
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Audit physical transfer ports
        run: python scripts/audit_antaq_physical_transfer_ports.py
      - name: Classify transfer port candidates
        run: python scripts/classify_physical_transfer_port_candidates.py
      - name: Audit front-1 against canonical hydro
        run: python scripts/audit_front1_against_canonical_hydro.py
      - name: Materialize validated spatial anchors
        run: python scripts/materialize_validated_spatial_transfer_anchors.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/validated_spatial_transfer_anchors/validated_spatial_transfer_anchors_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['validated_spatial_anchor_count'] == 3
          assert d['all_spatially_validated'] is True
          assert d['temporal_connector_impedance_resolved'] is False
          assert d['routing_enabled'] is False
          assert d['zero_time_assumed'] is False
          assert d['distance_to_time_conversion_used'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-validated-spatial-transfer-anchors
          path: artifacts/validated_spatial_transfer_anchors/
          if-no-files-found: error
          retention-days: 30
