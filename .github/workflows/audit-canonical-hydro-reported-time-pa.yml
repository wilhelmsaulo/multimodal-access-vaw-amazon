name: audit-canonical-hydro-reported-time-pa

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_canonical_hydro_reported_time_pa.py"
      - "scripts/prepare_multimodal_graph_inputs.py"
      - ".github/workflows/audit-canonical-hydro-reported-time-pa.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire transport bundle
        run: python scripts/build_transport_layers.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Audit direct canonical hydro times
        run: python scripts/audit_canonical_hydro_reported_time_pa.py
      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/canonical_hydro_reported_time_pa/canonical_hydro_reported_time_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['canonical_waterway_segments'] > 0
          assert d['time_imputation_applied'] is False
          assert d['ready_for_hydro_temporal_graph_decision'] is True
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-canonical-hydro-reported-time-audit
          path: artifacts/canonical_hydro_reported_time_pa/
          if-no-files-found: error
          retention-days: 30
