name: audit-multimodal-temporal-integration-readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_multimodal_temporal_integration_readiness.py"
      - ".github/workflows/audit-multimodal-temporal-integration-readiness.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4" "osmium>=4,<5"
      - name: Build official transport layers
        run: python scripts/build_transport_layers.py
      - name: Acquire OSM road network
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build transport topology
        run: python scripts/build_transport_topology.py
      - name: Build primary road graph
        run: python scripts/build_primary_motor_road_graph.py
      - name: Assign road travel times
        run: python scripts/assign_primary_road_travel_times.py
      - name: Complete road link times
        run: python scripts/complete_primary_road_link_times.py
      - name: Build hydro temporal reference graph
        run: python scripts/build_hydro_temporal_graph_reference.py
      - name: Audit multimodal integration readiness
        run: python scripts/audit_multimodal_temporal_integration_readiness.py
      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/multimodal_temporal_integration_readiness/multimodal_temporal_integration_readiness_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['terrestrial_temporal_ready'] is True
          assert d['hydro_temporal_ready'] is True
          assert d['waiting_time_included'] is False
          assert d['intermodal_connector_rule_resolved'] is False
          assert d['ready_for_final_multimodal_od'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-multimodal-temporal-integration-readiness
          path: artifacts/multimodal_temporal_integration_readiness/
          if-no-files-found: error
          retention-days: 30
