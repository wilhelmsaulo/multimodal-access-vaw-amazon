name: Stage 5 SOM interpretation

on:
  workflow_dispatch:
  push:
    branches: [stage4-mcdm]
    paths:
      - '.github/workflows/stage5-som-interpretation.yml'
      - 'src/analysis/interpret_stage5_som.py'
      - 'results/stage5/tables/stage5_som_selected_mapping.csv'
      - 'results/stage5/tables/stage5_som_selected_codebook.csv'
      - 'results/stage5/tables/stage5_som_training_audit.json'

permissions:
  contents: write

jobs:
  interpret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage4-mcdm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib

      - name: Interpret SOM and cross-tab frozen PROMETHEE
        run: python -m src.analysis.interpret_stage5_som

      - name: Validate interpretation
        run: |
          python - <<'PY'
          import json, pandas as pd
          a=json.load(open('results/stage5/tables/stage5_som_interpretation_audit.json',encoding='utf-8'))
          p=pd.read_csv('results/stage5/tables/stage5_som_municipal_profiles.csv')
          c=pd.read_csv('results/stage5/tables/stage5_som_profile_promethee_summary.csv')
          assert len(p)==144
          assert a['mcdm_cross_tab_performed_after_profile_construction'] is True
          assert a['mcdm_feedback_to_som_or_ranking'] is False
          assert len(c)==a['selected_profile_count']
          print(json.dumps(a,ensure_ascii=False,indent=2))
          PY

      - name: Commit Stage 5 interpretation outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/stage5/tables/stage5_som_node_profiles.csv \
                  results/stage5/tables/stage5_som_municipal_profiles.csv \
                  results/stage5/tables/stage5_som_profile_k_selection.csv \
                  results/stage5/tables/stage5_som_profile_characteristics.csv \
                  results/stage5/tables/stage5_som_profile_standardized_characteristics.csv \
                  results/stage5/tables/stage5_som_profiles_with_promethee.csv \
                  results/stage5/tables/stage5_som_profile_promethee_summary.csv \
                  results/stage5/tables/stage5_som_interpretation_audit.json \
                  results/stage5/figures/stage5_som_component_planes.png \
                  results/stage5/figures/stage5_som_profile_map.png
          if git diff --cached --quiet; then
            echo 'No SOM interpretation changes to commit.'
          else
            git commit -m 'Publish Stage 5 SOM profile interpretation'
            git push origin HEAD:stage4-mcdm
          fi
