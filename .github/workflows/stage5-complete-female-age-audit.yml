name: Stage 5 complete female age audit

on:
  workflow_dispatch:
  push:
    branches: [stage4-mcdm]
    paths:
      - '.github/workflows/stage5-complete-female-age-audit.yml'
      - 'src/analysis/build_stage5_complete_female_age_candidate.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage4-mcdm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas httpx

      - name: Acquire complete municipal female age composition
        run: python -m src.analysis.build_stage5_complete_female_age_candidate

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          df = pd.read_csv('results/stage5/tables/stage5_complete_female_age_candidate.csv', dtype={'municipality_code': str})
          cols = ['socio__female_age_share_15_29','socio__female_age_share_30_59','socio__female_age_share_60_plus']
          assert len(df) == 144
          assert df['municipality_code'].nunique() == 144
          assert df[cols].notna().all().all()
          assert ((df[cols] >= 0) & (df[cols] <= 1)).all().all()
          audit = json.load(open('results/stage5/tables/stage5_complete_female_age_audit.json', encoding='utf-8'))
          assert audit['municipalities'] == 144
          assert audit['missing_share_cells'] == 0
          assert audit['universe_results'] is True
          print(df.head().to_string(index=False))
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Commit audited Stage 5 age outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/stage5/tables/stage5_complete_female_age_candidate.csv \
                  results/stage5/tables/stage5_complete_female_age_audit.json
          if git diff --cached --quiet; then
            echo 'No complete female age changes to commit.'
          else
            git commit -m 'Publish Stage 5 complete female age audit'
            git push origin HEAD:stage4-mcdm
          fi
