name: audit-cnefe-pa

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/audit_cnefe_pa.py"
      - ".github/workflows/audit-cnefe-pa.yml"
      - "pyproject.toml"
  push:
    branches:
      - agent/stage1-stage2-accessibility
    paths:
      - "scripts/audit_cnefe_pa.py"
      - ".github/workflows/audit-cnefe-pa.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Audit CNEFE Pará schema and coordinate quality fields
        run: python scripts/audit_cnefe_pa.py
      - name: Upload privacy-preserving audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnefe-pa-schema-audit
          path: artifacts/cnefe_pa_audit/cnefe_pa_schema_audit.json
          if-no-files-found: error
          retention-days: 30
