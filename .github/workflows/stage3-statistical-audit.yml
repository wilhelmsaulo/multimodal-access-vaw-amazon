name: stage3-statistical-audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit-stage3-statistical'
    paths:
      - 'src/analysis/build_municipal_access_matrix.py'
      - 'src/analysis/revise_municipal_access_candidates.py'
      - 'src/analysis/stage3_statistical_audit.py'
      - 'src/analysis/audit_special_municipalities.py'
      - 'src/analysis/audit_afua_upstream.py'
      - '.github/workflows/stage3-statistical-audit.yml'

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3'
      - name: Download frozen Stage 2 OD
        uses: actions/download-artifact@v4
        with:
          name: pa-frozen-reference-od
          path: artifacts/od
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: wilhelmsaulo/multimodal-access-vaw-amazon
          run-id: 32951714732
      - name: Download frozen routing endpoints
        uses: actions/download-artifact@v4
        with:
          name: pa-frozen-routing-endpoints
          path: artifacts/endpoints
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: wilhelmsaulo/multimodal-access-vaw-amazon
          run-id: 32945266691
      - name: Download upstream nominal origin evidence
        uses: actions/download-artifact@v4
        with:
          name: pa-origin-network-access-evidence
          path: artifacts/origin_nominal
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: wilhelmsaulo/multimodal-access-vaw-amazon
          run-id: 32785322254
      - name: Download upstream empirical origin attachments
        uses: actions/download-artifact@v4
        with:
          name: pa-direct-attachment-transferability
          path: artifacts/origin_empirical
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: wilhelmsaulo/multimodal-access-vaw-amazon
          run-id: 32861477674
      - name: Build municipal accessibility matrix
        run: |
          python src/analysis/build_municipal_access_matrix.py \
            --od artifacts/od/od_reference_network.csv.gz \
            --origins artifacts/endpoints/origin_routing_endpoints.csv.gz \
            --out artifacts/stage3_input
      - name: Revise accessibility candidates and restore municipality universe
        run: |
          python src/analysis/revise_municipal_access_candidates.py \
            artifacts/stage3_input/municipal_accessibility_matrix.csv \
            --out artifacts/stage3_revised
      - name: Run Stage 3 statistical audit on revised candidates
        run: |
          python src/analysis/stage3_statistical_audit.py \
            artifacts/stage3_revised/municipal_accessibility_candidates_revised.csv \
            --out artifacts/stage3_statistical_audit_revised
      - name: Audit Afua Colares and Santa Cruz do Arari
        run: |
          python src/analysis/audit_special_municipalities.py \
            --endpoints-dir artifacts/endpoints \
            --od artifacts/od/od_reference_network.csv.gz \
            --out artifacts/special_municipality_audit
      - name: Trace Afua through upstream attachment evidence
        run: |
          python src/analysis/audit_afua_upstream.py \
            --nominal-dir artifacts/origin_nominal \
            --empirical-dir artifacts/origin_empirical \
            --endpoints-dir artifacts/endpoints \
            --out artifacts/afua_upstream_audit
      - name: Upload Stage 3 source matrix
        uses: actions/upload-artifact@v4
        with:
          name: stage3-municipal-accessibility-matrix
          path: artifacts/stage3_input
          if-no-files-found: error
          retention-days: 30
      - name: Upload revised 144-municipality candidate matrix
        uses: actions/upload-artifact@v4
        with:
          name: stage3-municipal-accessibility-candidates-revised
          path: artifacts/stage3_revised
          if-no-files-found: error
          retention-days: 30
      - name: Upload revised Stage 3 audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: stage3-statistical-audit-revised
          path: artifacts/stage3_statistical_audit_revised
          if-no-files-found: error
          retention-days: 30
      - name: Upload targeted municipality audit
        uses: actions/upload-artifact@v4
        with:
          name: stage3-special-municipality-audit
          path: artifacts/special_municipality_audit
          if-no-files-found: error
          retention-days: 30
      - name: Upload Afua upstream forensic audit
        uses: actions/upload-artifact@v4
        with:
          name: stage3-afua-upstream-audit
          path: artifacts/afua_upstream_audit
          if-no-files-found: error
          retention-days: 30
