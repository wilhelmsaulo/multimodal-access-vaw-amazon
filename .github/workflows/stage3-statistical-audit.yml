name: stage3-statistical-audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit-stage3-statistical'
    paths:
      - 'src/analysis/build_municipal_access_matrix.py'
      - 'src/analysis/stage3_statistical_audit.py'
      - '.github/workflows/stage3-statistical-audit.yml'

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas>=2.2,<3' 'numpy>=2,<3'
      - name: Download frozen Stage 2 OD
        uses: actions/download-artifact@v4
        with:
          name: pa-frozen-reference-od
          path: artifacts/od
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: wilhelmsaulo/multimodal-access-vaw-amazon
          run-id: 32951714732
      - name: Download frozen routing endpoints
        uses: actions/download-artifact@v4
        with:
          name: pa-frozen-routing-endpoints
          path: artifacts/endpoints
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: wilhelmsaulo/multimodal-access-vaw-amazon
          run-id: 32945266691
      - name: Build municipal accessibility matrix
        run: |
          python src/analysis/build_municipal_access_matrix.py \
            --od artifacts/od/od_reference_network.csv.gz \
            --origins artifacts/endpoints/origin_routing_endpoints.csv.gz \
            --out artifacts/stage3_input
      - name: Run Stage 3 statistical audit
        run: |
          python src/analysis/stage3_statistical_audit.py \
            artifacts/stage3_input/municipal_accessibility_matrix.csv \
            --out artifacts/stage3_statistical_audit
      - name: Upload Stage 3 input matrix
        uses: actions/upload-artifact@v4
        with:
          name: stage3-municipal-accessibility-matrix
          path: artifacts/stage3_input
          if-no-files-found: error
          retention-days: 30
      - name: Upload Stage 3 audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: stage3-statistical-audit
          path: artifacts/stage3_statistical_audit
          if-no-files-found: error
          retention-days: 30
