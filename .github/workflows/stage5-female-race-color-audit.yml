name: Stage 5 female race-color audit

on:
  workflow_dispatch:
  push:
    branches: [stage4-mcdm]
    paths:
      - '.github/workflows/stage5-female-race-color-audit.yml'
      - 'src/analysis/build_stage5_female_race_color_candidates.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage4-mcdm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas httpx openpyxl

      - name: Acquire female-specific race-color composition
        run: python -m src.analysis.build_stage5_female_race_color_candidates

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          p='results/stage5/tables/stage5_female_race_color_candidates.csv'
          df=pd.read_csv(p,dtype={'municipality_code':str})
          cols=[
            'socio__female_race_share_branca','socio__female_race_share_preta',
            'socio__female_race_share_parda','socio__female_race_share_amarela',
            'socio__female_race_share_indigena'
          ]
          assert len(df)==144
          assert df['municipality_code'].nunique()==144
          assert df[cols].notna().all().all()
          assert ((df[cols]>=0)&(df[cols]<=1)).all().all()
          audit=json.load(open('results/stage5/tables/stage5_female_race_color_audit.json',encoding='utf-8'))
          assert audit['municipalities']==144
          assert audit['female_specific'] is True
          assert audit['missing_share_cells']==0
          print(df.head().to_string(index=False))
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Commit audited Stage 5 female race outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/stage5/tables/stage5_female_race_color_candidates.csv \
                  results/stage5/tables/stage5_female_race_color_audit.json
          if git diff --cached --quiet; then
            echo 'No female race/color changes to commit.'
          else
            git commit -m 'Publish Stage 5 female race-color audit'
            git push origin HEAD:stage4-mcdm
          fi
