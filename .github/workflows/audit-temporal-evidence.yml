name: audit-temporal-evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_temporal_evidence.py"
      - "scripts/build_transport_topology.py"
      - "scripts/prepare_multimodal_graph_inputs.py"
      - "scripts/acquire_osm_roads.py"
      - "scripts/build_transport_layers.py"
      - "src/network/source_catalog.py"
      - ".github/workflows/audit-temporal-evidence.yml"
  push:
    branches: [agent/stage1-stage2-accessibility]
    paths:
      - "scripts/audit_temporal_evidence.py"
      - "scripts/build_transport_topology.py"
      - "scripts/prepare_multimodal_graph_inputs.py"
      - "scripts/acquire_osm_roads.py"
      - "scripts/build_transport_layers.py"
      - "src/network/source_catalog.py"
      - ".github/workflows/audit-temporal-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            "geopandas>=1.0,<2" \
            "pyogrio>=0.10,<1" \
            "shapely>=2,<3" \
            "pyproj>=3.7,<4" \
            "osmium>=4,<5"
      - name: Build official transport reference layers
        run: python scripts/build_transport_layers.py
      - name: Acquire routable OSM roads
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal layers
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build structural transport topology
        run: python scripts/build_transport_topology.py
      - name: Audit temporal evidence
        run: python scripts/audit_temporal_evidence.py
      - name: Validate temporal evidence audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("artifacts/temporal_evidence_audit/temporal_evidence_audit.json").read_text(encoding="utf-8"))
          print(json.dumps(a, ensure_ascii=False, indent=2))
          assert a["ready_for_external_temporal_calibration"] is True
          assert a["travel_time_assigned"] is False
          assert a["road_temporal_evidence"]["edges"] > 0
          assert a["other_modal_attribute_evidence"]["waterways"]["features"] > 0
          assert a["other_modal_attribute_evidence"]["ports"]["features"] > 0
          assert a["other_modal_attribute_evidence"]["airports"]["features"] > 0
          PY
      - name: Upload temporal evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: pa-temporal-evidence-audit
          path: artifacts/temporal_evidence_audit/
          if-no-files-found: error
          retention-days: 30
