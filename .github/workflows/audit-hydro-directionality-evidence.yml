name: audit-hydro-directionality-evidence

# Historical exploratory audit retained for reproducibility. The primary hydro
# model now canonicalizes overlapping ANTAQ archives by official hydro_id and
# treats TEMPO as corridor/network reference impedance, so this older
# directional-record hypothesis is no longer a PR-gating workflow.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire transport bundle
        run: python scripts/build_transport_layers.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build hydro temporal reference graph
        run: python scripts/build_hydro_temporal_graph_reference.py
      - name: Audit hydro directionality evidence
        run: python scripts/audit_hydro_directionality_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa-hydro-directionality-evidence-legacy
          path: artifacts/hydro_directionality_audit/
          if-no-files-found: warn
          retention-days: 30
