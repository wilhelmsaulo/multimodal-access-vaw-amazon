name: audit-road-speed-candidate-stability

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_road_speed_candidate_stability.py"
      - "scripts/build_transport_topology.py"
      - "scripts/acquire_osm_roads.py"
      - ".github/workflows/audit-road-speed-candidate-stability.yml"
  push:
    branches: [agent/stage1-stage2-accessibility]
    paths:
      - "scripts/audit_road_speed_candidate_stability.py"
      - "scripts/build_transport_topology.py"
      - "scripts/acquire_osm_roads.py"
      - ".github/workflows/audit-road-speed-candidate-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            "geopandas>=1.0,<2" \
            "pyogrio>=0.10,<1" \
            "shapely>=2,<3" \
            "pyproj>=3.7,<4" \
            "osmium>=4,<5"
      - name: Build official transport reference layers
        run: python scripts/build_transport_layers.py
      - name: Acquire routable OSM roads
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal layers
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build structural transport topology
        run: python scripts/build_transport_topology.py
      - name: Audit road speed candidate stability
        run: python scripts/audit_road_speed_candidate_stability.py --bootstrap-reps 1000
      - name: Validate stability audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path("artifacts/road_speed_candidate_stability")
          a = json.loads((root / "road_speed_candidate_stability_summary.json").read_text(encoding="utf-8"))
          t = pd.read_csv(root / "road_speed_candidate_stability_by_highway.csv")
          assert a["ready_for_road_speed_policy"] is True
          assert a["travel_time_assigned"] is False
          assert len(t) == a["highway_classes"]
          assert (t["observed_n"] >= 0).all()
          print(json.dumps(a, ensure_ascii=False, indent=2))
          PY
      - name: Upload stability audit
        uses: actions/upload-artifact@v4
        with:
          name: pa-road-speed-candidate-stability
          path: artifacts/road_speed_candidate_stability/
          if-no-files-found: error
          retention-days: 30
