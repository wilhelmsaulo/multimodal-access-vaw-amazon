name: derive-road-speed-calibration-candidates

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/derive_road_speed_calibration_candidates.py"
      - "scripts/build_transport_topology.py"
      - "scripts/acquire_osm_roads.py"
      - ".github/workflows/derive-road-speed-calibration-candidates.yml"
  push:
    branches: [agent/stage1-stage2-accessibility]
    paths:
      - "scripts/derive_road_speed_calibration_candidates.py"
      - "scripts/build_transport_topology.py"
      - "scripts/acquire_osm_roads.py"
      - ".github/workflows/derive-road-speed-calibration-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: road-speed-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            "geopandas>=1.0,<2" \
            "pyogrio>=0.10,<1" \
            "shapely>=2,<3" \
            "pyproj>=3.7,<4" \
            "osmium>=4,<5"
      - name: Build official transport reference layers
        run: python scripts/build_transport_layers.py
      - name: Acquire routable OSM roads
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal layers
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Build structural transport topology
        run: python scripts/build_transport_topology.py
      - name: Derive road speed calibration candidates
        run: python scripts/derive_road_speed_calibration_candidates.py
      - name: Validate candidate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path("artifacts/road_speed_calibration_candidates")
          a = json.loads((root / "road_speed_calibration_summary.json").read_text(encoding="utf-8"))
          t = pd.read_csv(root / "road_speed_candidates_by_highway.csv")
          assert a["edges_total"] > 0
          assert a["edges_with_unambiguous_observed_maxspeed"] > 0
          assert a["highway_classes_with_any_observed_maxspeed"] > 0
          assert a["travel_time_assigned"] is False
          assert a["ready_for_road_speed_model_decision"] is True
          assert len(t) == a["highway_classes_total"]
          print(json.dumps(a, ensure_ascii=False, indent=2))
          PY
      - name: Upload road speed calibration candidates
        uses: actions/upload-artifact@v4
        with:
          name: pa-road-speed-calibration-candidates
          path: artifacts/road_speed_calibration_candidates/
          if-no-files-found: error
          retention-days: 30
