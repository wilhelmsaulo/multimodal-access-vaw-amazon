name: audit-pareto-front1-transfer-ports

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_pareto_front1_transfer_ports.py"
      - "scripts/classify_physical_transfer_port_candidates.py"
      - "scripts/audit_antaq_physical_transfer_ports.py"
      - ".github/workflows/audit-pareto-front1-transfer-ports.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire official transport layers
        run: python scripts/build_transport_layers.py
      - name: Acquire OSM road network
        run: python scripts/acquire_osm_roads.py
      - name: Prepare canonical multimodal inputs
        run: python scripts/prepare_multimodal_graph_inputs.py
      - name: Audit physical transfer ports
        run: python scripts/audit_antaq_physical_transfer_ports.py
      - name: Classify transfer port candidates
        run: python scripts/classify_physical_transfer_port_candidates.py
      - name: Audit Pareto front-1 nominal provenance
        run: python scripts/audit_pareto_front1_transfer_ports.py
      - name: Validate nominal audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/antaq_pareto_front1_transfer_port_audit/pareto_front1_nominal_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['pareto_front1_count'] > 0
          assert d['all_have_administrative_endpoint_match'] is True
          assert d['all_recomputed_hydro_distances_consistent'] is True
          assert d['connector_promoted'] is False
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-pareto-front1-transfer-port-audit
          path: artifacts/antaq_pareto_front1_transfer_port_audit/
          if-no-files-found: error
          retention-days: 30
