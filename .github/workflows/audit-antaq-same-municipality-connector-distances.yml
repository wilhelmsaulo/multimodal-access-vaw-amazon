name: audit-antaq-same-municipality-connector-distances

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_antaq_same_municipality_connector_distances.py"
      - ".github/workflows/audit-antaq-same-municipality-connector-distances.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "geopandas>=1.0,<2" "pyogrio>=0.10,<1" "shapely>=2,<3" "pyproj>=3.7,<4"
      - name: Acquire official transport layers
        run: python scripts/build_transport_layers.py
      - name: Audit same-municipality connector distances
        run: python scripts/audit_antaq_same_municipality_connector_distances.py
      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/antaq_same_municipality_connector_distances/same_municipality_connector_distance_audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['endpoint_rows_total'] > 0
          assert d['endpoint_rows_with_same_municipality_port'] > 0
          assert d['connector_promoted'] is False
          assert d['ready_for_connector_distance_rule_decision'] is True
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pa-antaq-same-municipality-connector-distances
          path: artifacts/antaq_same_municipality_connector_distances/
          if-no-files-found: error
          retention-days: 30
