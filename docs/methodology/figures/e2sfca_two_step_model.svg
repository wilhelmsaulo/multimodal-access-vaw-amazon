<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#333333; stroke-width:2; rx:14; ry:14; }
      .title { font:700 30px Arial, sans-serif; fill:#111; }
      .label { font:600 21px Arial, sans-serif; fill:#111; }
      .small { font:400 18px Arial, sans-serif; fill:#222; }
      .formula { font:italic 20px Georgia, serif; fill:#111; }
      .arrow { stroke:#333; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .note { font:400 16px Arial, sans-serif; fill:#444; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="#fafafa"/>
  <text x="700" y="48" text-anchor="middle" class="title">E2SFCA — Enhanced Two-Step Floating Catchment Accessibility</text>

  <rect x="40" y="110" width="260" height="120" class="box"/>
  <text x="170" y="150" text-anchor="middle" class="label">OD travel times</text>
  <text x="170" y="185" text-anchor="middle" class="formula">tᵢⱼ</text>
  <text x="170" y="214" text-anchor="middle" class="small">corrected origin–service matrix</text>

  <rect x="40" y="300" width="260" height="120" class="box"/>
  <text x="170" y="340" text-anchor="middle" class="label">Female population</text>
  <text x="170" y="375" text-anchor="middle" class="formula">Pᵢ</text>
  <text x="170" y="404" text-anchor="middle" class="small">origin demand weight</text>

  <rect x="40" y="490" width="260" height="120" class="box"/>
  <text x="170" y="530" text-anchor="middle" class="label">Service supply</text>
  <text x="170" y="565" text-anchor="middle" class="formula">Sⱼ</text>
  <text x="170" y="594" text-anchor="middle" class="small">capacity or unit presence</text>

  <rect x="390" y="110" width="250" height="120" class="box"/>
  <text x="515" y="150" text-anchor="middle" class="label">Travel-time decay</text>
  <text x="515" y="185" text-anchor="middle" class="formula">wᵢⱼ = f(tᵢⱼ)</text>
  <text x="515" y="214" text-anchor="middle" class="small">optional threshold / decay</text>

  <rect x="720" y="220" width="290" height="155" class="box"/>
  <text x="865" y="260" text-anchor="middle" class="label">STEP 1</text>
  <text x="865" y="297" text-anchor="middle" class="small">Weighted demand around service j</text>
  <text x="865" y="330" text-anchor="middle" class="formula">Dⱼ = Σᵢ Pᵢ wᵢⱼ</text>
  <text x="865" y="360" text-anchor="middle" class="formula">Rⱼ = Sⱼ / Dⱼ</text>

  <rect x="1090" y="220" width="270" height="155" class="box"/>
  <text x="1225" y="260" text-anchor="middle" class="label">STEP 2</text>
  <text x="1225" y="297" text-anchor="middle" class="small">Accessibility at origin i</text>
  <text x="1225" y="335" text-anchor="middle" class="formula">Aᵢ = Σⱼ Rⱼ wᵢⱼ</text>
  <text x="1225" y="365" text-anchor="middle" class="small">by service type / scenario</text>

  <rect x="1090" y="500" width="270" height="120" class="box"/>
  <text x="1225" y="540" text-anchor="middle" class="label">Municipal profile</text>
  <text x="1225" y="575" text-anchor="middle" class="small">aggregate origin scores</text>
  <text x="1225" y="601" text-anchor="middle" class="small">only after rule is frozen</text>

  <path d="M300 170 L390 170" class="arrow"/>
  <path d="M640 170 C690 170 680 260 720 270" class="arrow"/>
  <path d="M300 360 C520 360 560 300 720 300" class="arrow"/>
  <path d="M300 550 C540 550 590 340 720 340" class="arrow"/>
  <path d="M1010 298 L1090 298" class="arrow"/>
  <path d="M640 190 C850 190 920 400 1090 330" class="arrow"/>
  <path d="M1225 375 L1225 500" class="arrow"/>

  <text x="700" y="700" text-anchor="middle" class="note">Methodological schematic only. No parameterization or empirical E2SFCA result is implied by this figure.</text>
  <text x="700" y="728" text-anchor="middle" class="note">Implementation: src/accessibility/e2sfca.py</text>
</svg>
