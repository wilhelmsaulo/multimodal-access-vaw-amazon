scope: para_state_service_access
policy:
  decision_universe: 144 municipalities of Para
  destination_services: Para only
  interstate_functional_influences: discussion_only
  synthetic_travel_time_allowed: false
  cartographic_distance_to_time_allowed: false
  unvalidated_waiting_time_allowed: false
  ordinary_access_air_routing: false
  mcdm_ranking_blocked_until_revalidated: true

backbone_structural_warning:
  frozen_materialized_road_hydro_terminal_identities: 3
  terminal_names: [Muana, Soure, Moju]
  interpretation: insufficient_transfer_coverage_requires_full_reaudit

municipalities:
  - municipality_code: '1502608'
    municipality_name: Colares
    previous_status: routing_ready_no_reachable_service
    revised_diagnosis: missing_validated_road_ferry_road_transfer
    transfer:
      mode: ferry
      corridor: PA-238 / Furo da Laura / Penhalonga
      user_supplied_port_reference: Porto da Balsa Penhalonga/Colares
      approximate_user_reference_coordinates: [-0.9949506, -48.1932262]
      topology_evidence_status: validated
      temporal_evidence_status: historical_academic_candidate_not_currently_locked
      temporal_candidate_crossing_min: 10
      temporal_candidate_provenance: academic_publication_2015_describing_local_crossing
      waiting_time_status: unresolved_not_fabricated
      allowed_in_od: false
    evidence:
      - type: official_state_road_definition
        note: PA-238 includes Colares - Travessia Furo da Laura (Penhalonga) - PA-140.
      - type: municipal_official
        note: Colares access to the continent is currently by ferry; bridge construction does not justify assuming bridge availability.
      - type: academic_transport_description
        note: Published local description reports approximately 10 minutes for the crossing; retained as a temporal candidate/sensitivity value, not claimed as a 2026 observation.

  - municipality_code: '1506401'
    municipality_name: Santa Cruz do Arari
    previous_status: routing_ready_no_reachable_service
    revised_diagnosis: missing_validated_hydro_terminal_route_transfer
    transfer:
      mode: passenger_hydro
      corridor: Santa Cruz do Arari / Belem
      topology_evidence_status: validated
      temporal_evidence_status: official_2022_candidate_plus_current_2026_schedule_existence
      temporal_candidate_belem_min: 420
      temporal_candidate_provenance: TRE_PA_2022_official_resolution_approximately_7_hours_by_launch
      current_schedule_status: validated_for_service_existence_2026
      current_duration_status: not_validated_2026
      waiting_time_status: unresolved_not_fabricated
      allowed_in_od: false
    evidence:
      - type: uploaded_technical_report
        note: Report documents historical access to Belem by launch and referrals to Belem, Soure and Cachoeira do Arari.
      - type: current_public_schedule_2026
        note: Belem terminal schedules list Santa Cruz do Arari, confirming current passenger-hydro service existence.
      - type: official_TRE_PA_2022
        note: Official material states approximately 7 hours by launch from Belem; retained as temporal candidate, not a 2026 measured duration.

  - municipality_code: '1500305'
    municipality_name: Afua
    previous_status: no_primary_routing_ready_origin
    revised_diagnosis: final_scope_limited_hydro_first_case
    transfer:
      mode: hydro_first
      para_only_destination_policy: true
      macapa_route_status: validated_current_but_excluded_from_primary_model
      para_surface_route_status: insufficient_operational_temporal_evidence
      afua_chaves_status: hydrographically_plausible_but_no_regular_passenger_edge_authorized
      air_to_belem_status: excluded_from_ordinary_access_baseline
      temporal_evidence_status: not_available_for_primary_para_surface_edge
      allowed_in_od: false
    final_policy:
      status: coverage_scope_limited
      reopen_route_search: false
      interpretation: absence_of_defensible_para_surface_temporal_edge_is_reported_as_model_scope_limitation_not_real_world_isolation
      mcdm_rule: keep_access_time_criteria_missing_and_do_not_assign_synthetic_penalty
      discussion_rule: discuss strong Macapa functional influence and exceptional territorial complexity outside the primary Para-only accessibility calculation
    evidence:
      - type: municipal_official_current_2026
        note: Municipality lists regular line boats Afua-Macapa; Belem-Afua is listed by small aircraft.
      - type: ministry_transport_hydro_map_2023
        note: Afua and Chaves lie in the navigable northern Marajo hydrographic system; this supports hydrographic plausibility only, not passenger time.
      - type: current_PREVBarco_2026
        note: Sequential Afua and Chaves service confirms practical vessel navigation in the area but is not public passenger transport.
      - type: model_scope
        note: Macapa influence is context/discussion only; primary destination services remain in Para.

required_actions:
  - close open-ended Afua route search under the final scope-limited policy above
  - perform one bounded statewide screen for omitted road-hydro and hydro-hydro transfer candidates
  - prioritize only candidates with concrete evidence of passenger/ferry operation; do not investigate every mapped waterway
  - rebuild the corrected OD only after selected added transfer edges have evidence-backed temporal impedance or an explicitly declared sensitivity value
  - rerun routing-dependent accessibility/E2SFCA outputs, Stage 3 audit, and Stage 4 MCDM
