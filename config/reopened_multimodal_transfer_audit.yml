scope: para_state_service_access
policy:
  decision_universe: 144 municipalities of Para
  destination_services: Para only
  interstate_functional_influences: discussion_only
  synthetic_travel_time_allowed: false
  cartographic_distance_to_time_allowed: false
  unvalidated_waiting_time_allowed: false
  ordinary_access_air_routing: false
  mcdm_ranking_blocked_until_revalidated: true

backbone_structural_warning:
  frozen_materialized_road_hydro_terminal_identities: 3
  terminal_names: [Muana, Soure, Moju]
  interpretation: insufficient_transfer_coverage_requires_full_reaudit

municipalities:
  - municipality_code: '1502608'
    municipality_name: Colares
    previous_status: routing_ready_no_reachable_service
    revised_diagnosis: missing_validated_road_ferry_road_transfer
    transfer:
      mode: ferry
      corridor: PA-238 / Furo da Laura / Penhalonga
      user_supplied_port_reference: Porto da Balsa Penhalonga/Colares
      approximate_user_reference_coordinates: [-0.9949506, -48.1932262]
      topology_evidence_status: validated
      temporal_evidence_status: historical_academic_candidate_not_currently_locked
      temporal_candidate_crossing_min: 10
      temporal_candidate_provenance: academic_publication_2015_describing_local_crossing
      waiting_time_status: pending
      allowed_in_od: false
    evidence:
      - type: official_state_road_definition
        note: PA-238 includes Colares - Travessia Furo da Laura (Penhalonga) - PA-140.
      - type: municipal_official
        note: Colares access to the continent is currently by ferry; bridge construction does not justify assuming bridge availability.
      - type: academic_transport_description
        note: Published local description reports approximately 10 minutes for the Penhalonga-to-island ferry crossing; retained as a temporal candidate/sensitivity value, not silently treated as a 2026 observation.
      - type: user_supplied_map_reference
        note: Porto da Balsa Penhalonga/Colares location supplied for terminal disambiguation only; map geometry is not converted to time.

  - municipality_code: '1506401'
    municipality_name: Santa Cruz do Arari
    previous_status: routing_ready_no_reachable_service
    revised_diagnosis: missing_validated_hydro_terminal_route_transfer
    transfer:
      mode: passenger_hydro
      corridor: Santa Cruz do Arari / Belem
      topology_evidence_status: validated
      temporal_evidence_status: official_2022_candidate_plus_current_2026_schedule_existence
      temporal_candidate_belem_min: 420
      temporal_candidate_provenance: TRE_PA_2022_official_resolution_approximately_7_hours_by_launch
      current_schedule_status: validated_for_service_existence_2026
      current_duration_status: not_validated_2026
      waiting_time_status: pending
      allowed_in_od: false
    evidence:
      - type: uploaded_technical_report
        note: Report documents approximately 115 km straight-line distance, about 13 h by ship historically, access to Belem by launch, and referrals to Belem, Soure and Cachoeira do Arari.
      - type: current_public_schedule_2026
        note: July/August 2026 Belem terminal schedules list Santa Cruz do Arari repeatedly, confirming ongoing regular passenger service.
      - type: official_TRE_PA_2022
        note: Official electoral planning material states approximately 7 hours by launch from Belem to Santa Cruz do Arari and approximately 4 hours from Cachoeira do Arari. The 7 h value is retained as an evidence-backed temporal candidate, not claimed as a 2026 measured duration.
      - type: state_regulatory_history
        note: State transport regulator previously authorized the Belem/Santa Cruz do Arari passenger line using the municipal port and Belem Hydro Terminal.

  - municipality_code: '1500305'
    municipality_name: Afua
    previous_status: no_primary_routing_ready_origin
    revised_diagnosis: hydro_first_origin_required_but_para_surface_route_unvalidated
    transfer:
      mode: hydro_first
      para_only_destination_policy: true
      macapa_route_status: validated_current_but_excluded_from_primary_model
      para_surface_route_status: not_validated_currently
      air_to_belem_status: validated_current_but_excluded_from_ordinary_access_baseline
      temporal_evidence_status: pending_for_any_para_surface_route
      allowed_in_od: false
    evidence:
      - type: municipal_official_current_2026
        note: Municipality states the island's regular line boats are Afua-Macapa; its Belem-Afua listing is by small-aircraft operator.
      - type: model_scope
        note: Macapa functional influence is retained for discussion/context but not used to expand the primary Para service destination universe.
      - type: interpretation
        note: Under the locked Para-only surface ordinary-access baseline, current evidence does not yet justify a Para-bound passenger-hydro temporal edge for Afua.

required_actions:
  - seek a current operational source for Colares ferry crossing duration and waiting/frequency; until then use 10 min only as sensitivity candidate if scientifically necessary
  - seek a current operational Santa Cruz do Arari travel duration; until then retain 420 min as official-2022 sensitivity candidate and historical 13 h ship value only as older context
  - continue targeted search for a current Para-bound passenger surface route for Afua; if none is validated, retain Afua as a documented scope-limited/coverage-limited case rather than fabricate connectivity
  - audit all road-hydro transfer terminals statewide because the frozen final backbone materialized only Muana, Soure and Moju as terminal identities
  - rebuild OD only after every primary added transfer edge has evidence-backed temporal impedance under the declared reference policy
  - rerun municipal accessibility/E2SFCA outputs affected by routing, Stage 3 statistical audit, and Stage 4 MCDM
